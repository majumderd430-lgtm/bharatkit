[build]
builder = "nixpacks"
buildCommand = "npm install && cd dashboard && npm install && npm run build && cd .. && npx prisma generate --schema=prisma/schema.prisma"

[deploy]
startCommand = "npx prisma migrate deploy --schema=prisma/schema.prisma && node src/server.js"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
